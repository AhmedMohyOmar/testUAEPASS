name: Trigger auto deployment for getotpapi-ca

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/getotpapi-ca-AutoDeployTrigger-ededda32-1668-4438-97aa-a9ad6a69d9b9.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.GETOTPAPICA_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: headlessbrowserdocker.azurecr.io
          registryUsername: ${{ secrets.GETOTPAPICA_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GETOTPAPICA_REGISTRY_PASSWORD }}
          containerAppName: getotpapi-ca
          resourceGroup: RG_TDRA_UAE
          imageToBuild: headlessbrowserdocker.azurecr.io/getotpapi-ca:${{ github.sha }}
          
            

     

